<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Pedrinho Barbearia">
  <defs>
    <pattern id="poleStripes" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#141210" />
      <rect width="7" height="14" fill="#c5a059" />
    </pattern>
    <path id="arcoTopo" d="M50,95 A74,74 0 0 1 190,95" fill="none" />
  </defs>

  <!-- Moldura -->
  <circle cx="120" cy="120" r="104" fill="#141210" stroke="#c5a059" stroke-width="4" />
  <circle cx="120" cy="120" r="90" fill="none" stroke="#c5a059" stroke-width="1.5" />

  <!-- Texto em arco -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24" fill="#c5a059" letter-spacing="3">
    <textPath href="#arcoTopo" startOffset="50%" text-anchor="middle">PEDRINHO</textPath>
  </text>

  <!-- Poste de barbeiro (esquerda) -->
  <g transform="translate(62,128) rotate(-18)">
    <rect x="-8" y="-38" width="16" height="76" rx="8" fill="url(#poleStripes)" stroke="#c5a059" stroke-width="2" />
    <ellipse cx="0" cy="-38" rx="9" ry="5" fill="#c5a059" />
    <ellipse cx="0" cy="38" rx="9" ry="5" fill="#c5a059" />
  </g>

  <!-- Tesoura (direita) -->
  <g transform="translate(178,128) rotate(18)" fill="none" stroke="#c5a059" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-10" cy="26" r="7" />
    <circle cx="10" cy="26" r="7" />
    <line x1="-6" y1="20" x2="12" y2="-34" />
    <line x1="6" y1="20" x2="-12" y2="-34" />
  </g>

  <!-- Rosto com barba e óculos -->
  <path d="M90,88 a30,22 0 0 1 60,0 z" fill="#c5a059" />
  <rect x="92" y="96" width="24" height="16" rx="6" fill="#c5a059" />
  <rect x="124" y="96" width="24" height="16" rx="6" fill="#c5a059" />
  <rect x="114" y="101" width="12" height="4" fill="#c5a059" />
  <circle cx="104" cy="104" r="6" fill="#141210" />
  <circle cx="136" cy="104" r="6" fill="#141210" />
  <path d="M120,118 C110,110 95,112 88,122 C98,120 108,122 120,124 C132,122 142,120 152,122 C145,112 130,110 120,118 Z" fill="#c5a059" />
  <path d="M85,112 C80,140 90,165 120,178 C150,165 160,140 155,112 C150,128 138,132 120,132 C102,132 90,128 85,112 Z" fill="#c5a059" />

  <!-- Faixa inferior -->
  <path d="M45,172 L33,187 L45,202 Z" fill="#141210" stroke="#c5a059" stroke-width="2" stroke-linejoin="round" />
  <path d="M195,172 L207,187 L195,202 Z" fill="#141210" stroke="#c5a059" stroke-width="2" stroke-linejoin="round" />
  <rect x="45" y="172" width="150" height="30" fill="#141210" stroke="#c5a059" stroke-width="2" />
  <text x="120" y="193" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="600" font-size="20" fill="#c5a059">Barbearia</text>
</svg>
